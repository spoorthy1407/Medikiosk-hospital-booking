{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="muted">Your bookings, reports and reminders are saved here.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Full name<input name="name" required value="{{ form.get('name', '') }}" placeholder="e.g. Ravi Kumar"></label>
      <label>Email<input type="email" name="email" required value="{{ form.get('email', '') }}" placeholder="you@example.com"></label>
      <div class="grid grid-3">
        <label>Phone<input name="phone" required value="{{ form.get('phone', '') }}" placeholder="9876543210"></label>
        <label>Age<input type="number" name="age" min="1" max="119" required value="{{ form.get('age', '') }}"></label>
        <label>Gender
          <select name="gender" required>
            <option value="">Select</option>
            {% for gname in ['Female', 'Male', 'Other'] %}
              <option {{ 'selected' if form.get('gender') == gname }}>{{ gname }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="grid grid-2">
        <label>Password<input type="password" name="password" required minlength="6"></label>
        <label>Confirm password<input type="password" name="confirm" required minlength="6"></label>
      </div>
      <button class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
